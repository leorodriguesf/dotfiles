- defaults:
    link:
      relink: true
      create: true
      backup: true

- clean:
    - "~"
    - "~/.config"
    - "~/.local/share"
    - "~/.local/bin"

- create:
    - ~/.config
    - ~/.cache
    - ~/.local/bin
    - ~/.local/share
    - ~/.local/state
    - ~/.local/state/zsh
    - ~/.cache/zsh
    - ~/.cache/starship
    - ~/dev/active
    - ~/dev/archive
    - ~/dev/sandbox
    - ~/work/repos
    - ~/work/sandbox
    - ~/work/notes
    - ~/life/10-finance # Personal taxes, bank statements, investments, receipts
    - ~/life/20-admin # Passports, medical records, apartment leases, insurance
    - ~/life/30-media # Camera rolls, ebooks, videos (Sub-foldered by Year)
    - ~/life/40-career # Personal resumes, portfolio assets, certifications
    - ~/life/50-hobbies # Non-dev interests (Music, gaming, 3D printing, etc.)
    - ~/inbox

- link:
    ~/.config/alacritty: ./.config/alacritty
    ~/.config/nvim: ./.config/nvim
    ~/.config/starship: ./.config/starship
    ~/.config/tmux: ./.config/tmux
    ~/.config/zsh: ./.config/zsh
    ~/.gnupg/gpg-agent.conf:
      if: "[ `uname` = Darwin ]"
      path: ./.gnupg/gpg-agent.conf
    ~/.local/bin: ./.local/bin
    ~/.local/share/signature.asc: ./.local/share/signature.asc
    ~/Library/Application Support/Code/User/settings.json:
      if: "[ `uname` = Darwin ]"
      path: ./Code/User/settings.json
    ~/.config/Code/User/settings.json:
      if: "[ `uname` = Linux ]"
      path: ./Code/User/settings.json
    ~/Library/Application Support/Cursor/User/settings.json:
      if: "[ `uname` = Darwin ]"
      path: ./Code/User/settings.json
    ~/.config/Cursor/User/settings.json:
      if: "[ `uname` = Linux ]"
      path: ./Code/User/settings.json
    ~/.gitconfig: ./.gitconfig
    ~/work/.gitconfig_work:
      if: '[ "${SHOULD_INSTALL_WORK_PROFILE}" = "true" ]'
      path: ./.gitconfig_work
    ~/.gitignore_global: ./.gitignore_global
    /etc/zshenv:
      if: "[ `uname` = Darwin ]"
      path: ./zshenv
    /etc/zsh/zshenv:
      if: "[ `uname` = Linux ]"
      path: ./zshenv
