- defaults:
    link:
      relink: true
      create: true
      backup: true

- clean:
    - "~"
    - "~/.config"
    - "~/.local/share"
    - "~/.local/bin"

- create:
    - ~/.config
    - ~/.cache
    - ~/.local/bin
    - ~/.local/share
    - ~/.local/state
    - ~/.local/state/zsh
    - ~/.cache/zsh
    - ~/.cache/starship
    - ~/dev/active
    - ~/dev/archive
    - ~/dev/sandbox
    - ~/work/repos
    - ~/work/sandbox
    - ~/work/notes
    - ~/life/10-finance # Personal taxes, bank statements, investments, receipts
    - ~/life/20-admin # Passports, medical records, apartment leases, insurance
    - ~/life/30-media # Camera rolls, ebooks, videos (Sub-foldered by Year)
    - ~/life/40-career # Personal resumes, portfolio assets, certifications
    - ~/life/50-hobbies # Non-dev interests (Music, gaming, 3D printing, etc.)
    - ~/inbox

- link:
    ~/.config/alacritty: ./.config/alacritty
    ~/.config/git/config: ./.config/git/config
    ~/.config/git/ignore: ./.config/git/ignore
    ~/.npmrc: ./.config/npm/.npmrc
    ~/.config/nvim: ./.config/nvim
    ~/.config/starship: ./.config/starship
    ~/.config/tmux: ./.config/tmux
    ~/.config/zsh: ./.config/zsh
    ~/.local/bin: ./.local/bin
    ~/.local/share/signature.asc: ./.local/share/signature.asc
    ~/.ssh/config: ./.ssh/config
    ~/.ssh/config.private: ./.ssh/config.private
    ~/.ssh/id_ed25519_macos_personal.pub: ./.ssh/id_ed25519_macos_personal.pub
    ~/.ssh/id_ed25519_macos_personal: ./.ssh/id_ed25519_macos_personal
    ~/.vscode/extensions/extensions.json: ./.vscode/extensions/extensions.json
