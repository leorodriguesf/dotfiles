- defaults:
    link:
      relink: true
      create: true
      backup: true

- link:
    ~/.config/git/config_work: ./.config/git/config_work
    ~/.npmrc: ./.config/npm/.npmrc_work
    ~/.config/zsh/work.zsh: ./.config/zsh/work.zsh

- shell:
    - description: "Copy SSH keys"
      quiet: true
      command: |
        cp -n ./.ssh/id_rsa_macos_work ~/.ssh/id_rsa_macos_work || true
        cp -n ./.ssh/id_rsa_macos_work.pub ~/.ssh/id_rsa_macos_work.pub || true
    - description: "Change SSH key permissions"
      quiet: true
      command: |
        chmod 600 ~/.ssh/id_rsa_macos_work
        chmod 644 ~/.ssh/id_rsa_macos_work.pub
