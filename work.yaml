- defaults:
    link:
      if: '[ "${SHOULD_INSTALL_WORK_PROFILE}" = "true" ]'
      relink: true
      create: true
      backup: true

- link:
    ~/.config/git/config_work: ./.config/git/config_work
    ~/.npmrc: ./.config/npm/.npmrc_work
    ~/.ssh/id_rsa_macos_work.pub: ./.ssh/id_rsa_macos_work.pub
    ~/.ssh/id_rsa_macos_work: ./.ssh/id_rsa_macos_work
