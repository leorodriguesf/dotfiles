    ~/Library/Application Support/Cursor/User/settings.json: ./Code/User/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: ./Code/User/keybindings.json
    ~/Library/Application Support/Cursor/User/keybindings.json: ./Code/User/keybindings.json
