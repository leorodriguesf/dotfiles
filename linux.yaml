- defaults:
    link:
      if: "[ `uname` = Linux ]"
      relink: true
      create: true
      backup: true

- link:
    /etc/zsh/zshenv: ./zshenv
    ~/.config/Code/User/settings.json: ./Code/User/settings.json
    ~/.config/Cursor/User/settings.json: ./Code/User/settings.json
    ~/.config/Code/User/keybindings.json: ./Code/User/keybindings.json
    ~/.config/Cursor/User/keybindings.json: ./Code/User/keybindings.json
